name: CI

on:
  pull_request:

# PR-only, single job: one full gate per PR on the self-hosted macOS runner.
# No push trigger and no second leg, so a single-runner machine does one job
# per PR instead of three serialized ones (ADR-0119).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: [self-hosted, tgcli]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Check the lockfile matches pyproject.toml
        run: uv lock --check
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Check architecture
        run: uv run python scripts/check-architecture.py
      - name: Type check
        run: uv run pyright
      - name: Run tests
        run: uv run pytest -q -n auto
      - name: Check Telethon coverage matrix
        run: uv run python scripts/check-coverage.py
      - name: Check user guide against the CLI surface
        run: uv run python scripts/check-docs.py
