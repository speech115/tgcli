name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A branch with an open PR triggers both events for the same SHA; keep the
# newest run per ref and cancel the duplicate.
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Check architecture
        run: uv run python scripts/check-architecture.py
      - name: Type check
        run: uv run pyright
      - name: Run tests
        run: uv run pytest -q
      - name: Check Telethon coverage matrix
        run: uv run python scripts/check-coverage.py
      - name: Check user guide against the CLI surface
        run: uv run python scripts/check-docs.py
