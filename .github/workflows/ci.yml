name: CI

on:
  pull_request:
  push:
    branches: [main]

# One full gate per PR, and again on main after a squash merge, so the merged
# combination of PRs is checked too. GitHub-hosted macOS: the target platform,
# and a public repository's fork PRs must not run on the owner's Mac (ADR-0121).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Check the lockfile matches pyproject.toml
        run: uv lock --check
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Check architecture
        run: uv run python scripts/check-architecture.py
      - name: Type check
        run: uv run pyright
      - name: Run tests
        # Same hostile values as scripts/gate.sh: tests set their own env.
        run: env TGCLI_READONLY=1 TGCLI_ACCOUNT=gate-isolation uv run pytest -q -n auto
      - name: Check Telethon coverage matrix
        run: uv run python scripts/check-coverage.py
      - name: Check docs against the CLI surface
        run: uv run python scripts/check-docs.py
