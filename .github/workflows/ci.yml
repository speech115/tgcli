name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Push and pull_request runs use distinct refs and check names. This preserves
# pre-PR branch CI without creating two required "test" checks for one SHA.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ github.event_name == 'pull_request' && 'test' || 'branch-test' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Check the lockfile matches pyproject.toml
        run: uv lock --check
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Check architecture
        run: uv run python scripts/check-architecture.py
      - name: Type check
        run: uv run pyright
      - name: Run tests
        run: uv run pytest -q -n auto
      - name: Check Telethon coverage matrix
        run: uv run python scripts/check-coverage.py
      - name: Check user guide against the CLI surface
        run: uv run python scripts/check-docs.py

  # macOS is a first-class target and has caught platform-only defects
  # (bf-03: case-insensitive alias collision on APFS). PR-gated so branch
  # pushes stay cheap; lint/pyright are platform-independent and stay on
  # the ubuntu leg (ADR-0059).
  test-macos:
    name: test-macos
    if: github.event_name == 'pull_request'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run tests
        run: uv run pytest -q -n auto
