name: CI

on:
  push:
    branches: [main]
  pull_request:

# Feature branches run once through pull_request; main runs once after merge.
# This keeps the required "test" context single-valued for every PR commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Check architecture
        run: uv run python scripts/check-architecture.py
      - name: Type check
        run: uv run pyright
      - name: Run tests
        run: uv run pytest -q
      - name: Check Telethon coverage matrix
        run: uv run python scripts/check-coverage.py
      - name: Check user guide against the CLI surface
        run: uv run python scripts/check-docs.py
