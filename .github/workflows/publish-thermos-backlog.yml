name: Publish thermos backlog

on:
  workflow_dispatch:
    inputs:
      only:
        description: >-
          Optional comma-separated ticket ids (e.g. T01,T04). Leave empty for all 37.
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-thermos-backlog.yml

permissions:
  contents: read
  issues: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish ticket bodies as GitHub issues
        env:
          ONLY: ${{ inputs.only }}
        run: |
          set -euo pipefail
          args=(python3 scripts/publish-thermos-backlog.py --apply)
          if [[ -n "${ONLY// /}" ]]; then
            IFS=',' read -ra ids <<< "${ONLY// /}"
            for id in "${ids[@]}"; do
              [[ -n "$id" ]] && args+=(--only "$id")
            done
          fi
          "${args[@]}"
