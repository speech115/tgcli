name: Release tag

# ADR-0038 requires every released commit to carry its `vX.Y.Z` tag. The rule is
# unchanged; only its executor is. A session that merges a release cannot push
# `refs/tags/*` — the git proxy answers 403 — so the step was always somebody's
# manual follow-up, and seven consecutive releases shipped untagged. CI owns it
# now, at the one moment the release commit is known to exist.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Tag the release commit when this push bumped the version
        env:
          # The previous tip of `main`, so the job can tell a release push from
          # any other push. All-zeros when the ref was just created.
          BEFORE: ${{ github.event.before }}
        run: |
          # A tag that fails to push must turn the run red, never be reported
          # as created: a silently skipped tag is the bug this job exists for.
          set -eu

          read_version() {
            git show "$1:src/tgcli/__init__.py" 2>/dev/null \
              | sed -n 's/^__version__ = "\(.*\)"/\1/p'
          }

          version=$(read_version HEAD)
          if [ -z "$version" ]; then
            echo "could not read __version__ from src/tgcli/__init__.py"
            exit 1
          fi

          # Tag the commit that *introduced* the version, never merely the
          # newest commit that happens to carry it. Without this an untagged
          # release lets the next unrelated push to main claim its tag: when
          # this workflow first landed, v1.2.10-v1.2.16 were all still
          # untagged, so tagging HEAD would have pinned v1.2.16 to whatever
          # merged next instead of to the commit that shipped it.
          previous=""
          if [ -n "$BEFORE" ] \
            && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            previous=$(read_version "$BEFORE")
          else
            echo "no usable previous tip ($BEFORE); refusing to guess"
            exit 0
          fi

          if [ -z "$previous" ]; then
            echo "could not read the previous version at $BEFORE; refusing to guess"
            exit 0
          fi

          if [ "$version" = "$previous" ]; then
            echo "version unchanged at $version; nothing to tag"
            exit 0
          fi

          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists; nothing to do"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "$tag"
          git push origin "$tag"
          echo "created $tag at $(git rev-parse --short HEAD) (was $previous)"
