[project]
name = "tgcli"
version = "1.1.1"
description = "Stateless Telegram CLI for humans, scripts, and AI agents"
requires-python = ">=3.12"
dependencies = ["telethon==1.44.0"]

[project.scripts]
tg = "tgcli.cli:entrypoint"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8", "pyright>=1.1.390"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tgcli"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "basic"
