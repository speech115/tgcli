[project]
name = "tgcli"
version = "3.0.4"
description = "Stateless Telegram CLI for humans, scripts, and AI agents"
requires-python = ">=3.12"
dependencies = ["telethon==1.44.0"]

[project.scripts]
tg = "tgcli.cli:entrypoint"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.16",
    "pyright>=1.1.390",
    "hypothesis>=6.100",
    "pytest-xdist>=3.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tgcli"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]
target-version = "py312"
# Keep Markdown out of format/check: v0.16 formats fenced Python by default,
# and docs/superpowers/ is closed history that must not be rewritten.
extend-exclude = ["**/*.md"]

[tool.ruff.lint]
# ADR-0057 lint policy: pycodestyle (E/W, so line-length is enforced,
# not just declared), pyflakes (F), import order (I), pyupgrade (UP), and
# comprehensions (C4). Deliberately out: rule families whose fixes rewrite
# logic rather than layout (B, SIM, PTH), unused-argument noise from the
# Telethon fakes in tests (ARG), and RUF ambiguous-unicode, which fires on
# the Cyrillic strings ADR-0050 requires.
select = ["E", "W", "F", "I", "UP", "C4"]
# PEP 695 `type X = ...` builds a TypeAliasType: get_args() on it returns ()
# and the read-operation registry test introspects that union.
ignore = ["UP040"]

[tool.ruff.lint.isort]
# `from x import a as b, c as d` stays one statement; splitting aliased members
# into a statement each is how this repo's clone imports already read.
combine-as-imports = true

[tool.pyright]
include = ["src"]
typeCheckingMode = "basic"
