[project]
name = "tgcli"
version = "5.1.0"
description = "Stateless Telegram CLI for humans, scripts, and AI agents"
requires-python = ">=3.12"
dependencies = ["telethon==1.44.0", "segno==1.6.6"]

[project.optional-dependencies]
# Optional because wheels cover Apple Silicon but not Intel Macs.
fast = ["cryptg>=0.6"]

[project.scripts]
tg = "tgcli.cli:entrypoint"
tg-serve = "tgcli.serve:entrypoint"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.16",
    "pyright>=1.1.390",
    "hypothesis>=6.100",
    "pytest-xdist>=3.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tgcli"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]
target-version = "py312"
# Keep Markdown out of format/check: v0.16 formats fenced Python by default.
extend-exclude = ["**/*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "C4", "B", "T20"]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["T20"]
"tests/**" = ["T20"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.pyright]
include = ["src"]
typeCheckingMode = "standard"
# CI type-checks on Linux; check the macOS branches the tool runs on.
pythonPlatform = "Darwin"
# Editor language servers run outside `uv run`; point them at the project venv
# and Python instead of whatever python3 is on PATH.
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
