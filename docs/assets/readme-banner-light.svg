<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-labelledby="title desc">
  <title id="title">tgcli</title>
  <desc id="desc">Stateless Telegram CLI for humans, scripts, and AI agents — light theme banner</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbfd"/>
      <stop offset="100%" stop-color="#e9f1f6"/>
    </linearGradient>
    <linearGradient id="tg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2aabee"/>
      <stop offset="100%" stop-color="#229ed9"/>
    </linearGradient>
    <style>
      .sans { font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 19px; }
      .fg { fill: #0d1c26; }
      .muted { fill: #55707f; }
      .dim { fill: #8aa3b1; }
      .str { fill: #157a49; }
    </style>
  </defs>

  <rect width="1280" height="460" fill="url(#bg)"/>
  <rect x="0" y="0" width="1280" height="3" fill="url(#tg)"/>

  <g transform="translate(72,64)">
    <rect x="0" y="0" width="56" height="56" rx="14" fill="url(#tg)"/>
    <path d="M12 28 L44 15 L38 44 L29 35 L23 41 L23 32 Z" fill="#ffffff"/>
    <text class="sans fg" x="76" y="30" font-size="38" font-weight="700">tgcli</text>
    <text class="sans muted" x="76" y="56" font-size="17">Telegram CLI: read, search, send &#183; no daemons, JSON everywhere</text>
  </g>

  <g transform="translate(72,168)">
    <rect x="0" y="0" width="1136" height="212" rx="14" fill="#ffffff" stroke="#cfe0ea"/>
    <circle cx="26" cy="26" r="6" fill="#d6e4ec"/>
    <circle cx="46" cy="26" r="6" fill="#d6e4ec"/>
    <circle cx="66" cy="26" r="6" fill="#d6e4ec"/>
    <line x1="0" y1="52" x2="1136" y2="52" stroke="#e4eef3"/>
    <g class="mono">
      <text x="28" y="90"><tspan class="dim">$</tspan> <tspan class="fg">tg --json dialogs --unread-only</tspan></text>
      <text x="28" y="124"><tspan class="dim">$</tspan> <tspan class="fg">tg --json search --all </tspan><tspan class="str">"invoice"</tspan><tspan class="fg"> --limit 20</tspan></text>
      <text x="28" y="158"><tspan class="dim">$</tspan> <tspan class="fg">tg --json send @user </tspan><tspan class="str">"hello"</tspan><tspan class="fg"> --preview</tspan></text>
      <text x="28" y="192"><tspan class="dim">$</tspan> <tspan class="fg">tg --json send --commit p_9f3a</tspan><tspan class="dim">   # nothing leaves without this</tspan></text>
    </g>
  </g>

  <text class="sans muted" x="72" y="416" font-size="15">stateless<tspan class="dim">&#160;&#160;&#183;&#160;&#160;</tspan>JSON on stdout<tspan class="dim">&#160;&#160;&#183;&#160;&#160;</tspan>preview &#8594; commit<tspan class="dim">&#160;&#160;&#183;&#160;&#160;</tspan>audited mutations<tspan class="dim">&#160;&#160;&#183;&#160;&#160;</tspan>Python 3.12+</text>
</svg>
